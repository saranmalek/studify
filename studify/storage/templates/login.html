<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studify - Login</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    />
    {% load static %}
    <link rel="stylesheet" href="{% static 'login.css'%}">
    
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light">
      <div class="container">
        <a class="navbar-brand" href="index.html" style="color: white"
          >Studify</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-toggle="collapse"
          data-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ml-auto">
            <li class="nav-item">
              <a class="nav-link" href="{% url 'home' %}" style="color: white"
                >Home</a
              >
            </li>
          </ul>
          <div class="nav-item">
            <a class="nav-link btn btn-login" href="{% url 'register' %}"
              >Register</a
            >
          </div>
        </div>
      </div>
    </nav>

    <!-- Video Background -->
    <div class="content">
      <div class="video-background">
        <video autoplay muted loop id="hero-video">
          <source
            src="{% static 'Gradient Loop Background.mp4' %}"
            type="video/mp4"
          />
          Your browser does not support HTML5 video.
        </video>
      </div>

      <!-- Login Form -->
      <div class="container">
        <div class="form-container">
          <h2 class="text-center">Login</h2>
          <form>
            <div class="form-group">
              <input
                type="text"
                class="form-control"
                placeholder="YOUR NAME"
                required
              />
            </div>
            <div class="form-group">
              <input
                type="email"
                class="form-control"
                placeholder="Email"
                required
              />
            </div>
            <div class="form-group">
              <input
                type="password"
                class="form-control"
                placeholder="Password"
                required
              />
            </div>
            <p>
              Don't have an account?
              <a href="{% url 'register' %}" class="links">Create account</a>
            </p>
            <button type="submit" class="btn btn-primary btn-block">
              Login
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-4">
      <div class="container">
        <p>&copy; 2024 Studify. All rights reserved.</p>
        <div class="footer-nav">
          <a href="index.html">Home</a>
          <a href="#">Features</a>
          <a href="#">About</a>
          <a href="#">Contact</a>
        </div>
      </div>
    </footer>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  </body>
</html>
